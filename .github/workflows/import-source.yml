name: Import verified site source
on:
  push:
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore prepared site source
        run: |
          python - <<'PY'
          import base64,io,os,zipfile
          zipfile.ZipFile(io.BytesIO(base64.b64decode(''))).extractall('.')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Import Pass Support Astro migration source"
          git push
