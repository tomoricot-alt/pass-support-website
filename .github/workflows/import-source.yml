name: Build and import site source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore initial source
        if: hashFiles('package.json') == ''
        run: |
          python - <<'PY'
          import base64,io,zipfile
          zipfile.ZipFile(io.BytesIO(base64.b64decode(''))).extractall('.')
          PY
      - run: npm ci
      - run: npm run build
      - name: Register source files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Register verified Pass Support Astro source"
          git push
